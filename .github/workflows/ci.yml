name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Pack the .mcpb, unpack it, and run the smoke test against what users install.
      - run: npm run pack
      - run: npx mcpb unpack wlanpi-mcp-extension.mcpb build/mcpb
      - run: npm run test:smoke
        env:
          WLANPI_SMOKE_DIR: ${{ github.workspace }}/build/mcpb
      # Same for the Claude Code plugin, as the release branch will carry it.
      - run: node scripts/assemble-plugin.mjs
      - run: npm run test:smoke
        env:
          WLANPI_SMOKE_DIR: ${{ github.workspace }}/build/plugin
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wlanpi-mcp-extension-mcpb
          path: wlanpi-mcp-extension.mcpb
